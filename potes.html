<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potes</title>
<style>
  :root{
    --bg:#0e1014; --card:#171a21; --card2:#1e222b; --line:#272c37;
    --text:#e6e9ef; --muted:#8b94a7; --dim:#5d6577;
    --accent:#5eead4; --livre:#fbbf24; --danger:#f87171;
    --pig:#f0a0bd; --pig2:#d97fa0; --gold:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto;padding:24px 16px 80px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
  h1 span{color:var(--muted);font-weight:400;font-size:14px;display:block;margin-top:2px}
  .totalbox{text-align:right}
  .totalbox .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  .totalbox .val{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  button{
    font:inherit;font-size:14px;cursor:pointer;border-radius:9px;
    border:1px solid var(--line); background:var(--card2); color:var(--text);
    padding:9px 14px; transition:.13s;
  }
  button:hover{background:#262b35;border-color:#39404e}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);color:#04211d;border-color:var(--accent);font-weight:600}
  button.primary:hover{background:#7df0dc}
  button.ghost{background:transparent;color:var(--muted)}
  button.ghost:hover{color:var(--text)}
  button.mini{padding:5px 10px;font-size:13px;border-radius:7px}
  button.danger{color:var(--danger)}
  button.primary.danger{background:var(--danger);border-color:var(--danger);color:#2b0b0b}
  button.primary.danger:hover{background:#fb9090}
  button.primary.gold{background:var(--gold);border-color:var(--gold);color:#2b1d02}
  button.primary.gold:hover{background:#fcd34d}
  button.smash{border-color:#4a3320;color:var(--gold)}
  button.smash:hover{background:#2a2113;border-color:#6b4a24}

  .livrebox{
    background:linear-gradient(180deg,#1e1b14,#171a21);border:1px solid #3a3320;
    border-radius:14px;padding:16px 18px;margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;transition:.25s;
  }
  .livrebox.flash{border-color:var(--livre);box-shadow:0 0 0 3px #fbbf2426}
  .lb-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--livre);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .lb-val{font-size:31px;font-weight:680;font-variant-numeric:tabular-nums;letter-spacing:-.025em;line-height:1.15}
  .lb-val.neg{color:var(--danger)}
  .lb-sub{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .lb-acts{display:flex;gap:6px}

  /* ---- chips de tag ---- */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:12.5px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);
    background:transparent;color:var(--muted);cursor:pointer}
  .chip:hover{color:var(--text);border-color:#39404e}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#04211d;font-weight:600}

  /* ---- lista de potes ---- */
  .potes{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
  .row{display:flex;align-items:center;gap:10px;padding:11px 14px;position:relative;
    border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--card2)}
  .row.dragging{opacity:.55;background:var(--card2)}
  .grip{color:var(--dim);cursor:grab;touch-action:none;padding:0 2px;line-height:1;
    font-size:15px;letter-spacing:-2px;user-select:none;flex:none}
  .grip:active{cursor:grabbing}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .rname{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rtags{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden;flex:1;min-width:0;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent)}
  .rtag{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;
    padding:1px 8px;white-space:nowrap}
  .rval{font-variant-numeric:tabular-nums;font-weight:650;font-size:15px;white-space:nowrap}
  .rval.neg{color:var(--danger)}
  .chev{color:var(--dim);flex:none;font-size:15px;line-height:1}
  .rbar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);opacity:.75;transition:.4s}
  .pote-sub{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .meter{height:5px;border-radius:3px;background:#232832;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:.4s}
  .acts-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .acts-grid button{width:100%}
  .acts-grid .full{grid-column:1 / -1}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:30px 0 10px;font-weight:600}
  .hist{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .h-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .h-row:last-child{border-bottom:none}
  .h-main{flex:1;min-width:0}
  .h-desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .h-when{font-size:12px;color:var(--dim);margin-top:1px}
  .h-val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .h-val.pos{color:var(--accent)}
  .h-val.neg{color:var(--danger)}
  .empty{padding:22px 14px;color:var(--dim);text-align:center;font-size:14px}

  /* ---- modal: o margin:auto e o que centraliza o <dialog> ---- */
  dialog{
    margin:auto; border:1px solid var(--line); background:var(--card); color:var(--text);
    border-radius:15px; padding:0; width:min(420px,calc(100vw - 32px));
    animation:dlgIn .16s ease-out;
  }
  @keyframes dlgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
  .d-head{padding:17px 20px 0;font-size:17px;font-weight:650}
  .d-body{padding:16px 20px;display:flex;flex-direction:column;gap:13px}
  .d-foot{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  input,select{
    width:100%;font:inherit;padding:9px 11px;border-radius:9px;
    border:1px solid var(--line);background:#11141a;color:var(--text);
  }
  input:focus,select:focus{outline:none;border-color:var(--accent);background:#0d1015}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.45}
  .hint b.neg{color:var(--danger)}
  .preview{background:#11141a;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13.5px}
  .preview div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-variant-numeric:tabular-nums}
  .preview div.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:6px;font-weight:600}
  .warn{color:var(--livre);font-size:12.5px}
  .foot{margin-top:34px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .foot .note{font-size:12px;color:var(--dim);flex:1;min-width:180px}
  .bar-right{margin-left:auto;display:flex;gap:6px;align-items:center}
  button.icon{padding:8px;line-height:0;border-radius:9px;color:var(--muted)}
  button.icon svg{width:17px;height:17px;display:block}
  button.icon.on{color:var(--accent)}
  button.icon.err{color:var(--danger);border-color:#4a2020}
  button.icon.busy{color:var(--accent)}
  button.icon.busy svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  button.icon.out{color:var(--danger)}
  button.icon.out:hover{background:#2a1616;border-color:#4a2020}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  @media(max-width:520px){ header{align-items:flex-start} .totalbox{text-align:left} }

  /* ---------- quebrar o cofrinho ---------- */
  .smashfx{position:fixed;inset:0;z-index:99;display:grid;place-items:center;
    background:#0b0d11e6;backdrop-filter:blur(4px);animation:fadeIn .18s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .smashfx.out{animation:fadeOut .45s ease-in forwards}
  @keyframes fadeOut{to{opacity:0}}
  .stage{position:relative;width:260px;height:260px;display:grid;place-items:center}
  .pig{position:relative;width:210px;height:170px;animation:wob .62s ease-in-out}
  @keyframes wob{
    0%{transform:none} 12%{transform:rotate(-7deg) scale(1.04)}
    28%{transform:rotate(6deg) scale(1.05)} 44%{transform:rotate(-6deg) scale(1.07)}
    60%{transform:rotate(5deg) scale(1.08)} 76%{transform:rotate(-4deg) scale(1.11)}
    100%{transform:rotate(0) scale(1.14)}
  }
  .half{position:absolute;inset:0}
  .half svg{width:100%;height:100%;display:block}
  .half.top svg{clip-path:inset(0 0 53% 0)}
  .half.bot svg{clip-path:inset(47% 0 0 0)}
  .go .half.top{animation:flyT .9s cubic-bezier(.2,.7,.3,1) forwards}
  .go .half.bot{animation:flyB .9s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes flyT{0%{opacity:1}62%{opacity:1}100%{transform:translate(-58px,-96px) rotate(-38deg);opacity:0}}
  @keyframes flyB{0%{opacity:1}62%{opacity:1}100%{transform:translate(52px,70px) rotate(26deg);opacity:0}}
  .go .pig{animation:none;transform:scale(1.14)}
  .flash{position:absolute;width:150px;height:150px;border-radius:50%;background:#fff;opacity:0}
  .go .flash{animation:pop .42s ease-out}
  @keyframes pop{0%{opacity:.85;transform:scale(.2)}100%{opacity:0;transform:scale(2.6)}}
  .coin{position:absolute;width:19px;height:19px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fde68a,var(--gold) 62%,#c98a12);
    box-shadow:0 0 10px #fbbf2455;opacity:0}
  .go .coin{animation:fly 1.05s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes fly{
    0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}
    65%{opacity:1}
    100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.05) rotate(var(--r))}
  }
  .shard{position:absolute;width:11px;height:13px;background:var(--pig2);opacity:0;
    clip-path:polygon(50% 0,100% 72%,18% 100%)}
  .go .shard{animation:fly .85s ease-out forwards}
  .smash-txt{position:absolute;bottom:6px;text-align:center;width:100%;opacity:0}
  .go .smash-txt{animation:rise .5s .5s ease-out forwards}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .smash-txt .big{font-size:27px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .smash-txt .sm{font-size:13.5px;color:var(--muted);margin-top:3px}
  @media(prefers-reduced-motion:reduce){
    .pig,.go .half.top,.go .half.bot,.go .coin,.go .shard,.go .flash,.go .smash-txt,dialog{animation:none!important}
    .go .half{opacity:0} .go .smash-txt{opacity:1}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Potes<span id="sub"></span></h1>
  </header>

  <section class="livrebox" id="livrebox">
    <div>
      <div class="lb-lbl" id="livreNome"></div>
      <div class="lb-val" id="livreVal"></div>
      <div class="lb-sub" id="livreSub"></div>
    </div>
    <div class="lb-acts">
      <button class="mini" id="bGasto">− Gasto</button>
      <button class="mini" id="bEntrada">+ Entrada</button>
    </div>
  </section>

  <div class="bar">
    <button class="primary" id="bReceber">Entrada mensal</button>
    <button id="bNovo">Novo pote</button>
    <button id="bTransf" class="ghost">Transferir</button>
    <button id="bRenda" class="ghost"><b id="rendaLbl"></b>/mês</button>
    <span class="bar-right">
      <button id="bCloud" class="icon" aria-label="Sincronizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg></button>
      <button id="bOut" class="icon out" aria-label="Desconectar" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </span>
  </div>

  <div class="chips" id="chips"></div>
  <div class="potes" id="potes"></div>

  <h2>Histórico</h2>
  <div class="hist" id="hist"></div>

  <div class="foot">
    <span class="note" id="persistNote"></span>
    <button class="mini" id="bExport">Exportar backup</button>
    <button class="mini" id="bImport">Importar</button>
  </div>
</div>

<dialog id="dlg"></dialog>

<script>
"use strict";

/* ---------- dinheiro em centavos, nada de float ---------- */
const fmt = c => (c<0?"-":"") + "R$ " + (Math.abs(c)/100).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
function parseMoney(s){
  if(typeof s === "number") return Math.round(s*100);
  s = String(s).trim().replace(/[R$\s]/gi,"");
  if(!s) return NaN;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length > 1) s = s.replace(/\./g,"");
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n*100) : NaN;
}
const uid = () => Math.random().toString(36).slice(2,10);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const SEED = {
  renda: 0,
  potes: [{id:"livre", nome:"Livre", aporte:0, saldo:0, meta:0, livre:true}],
  hist: []
};
const KEY = "potes.v1";
let storageOK = true, S;

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }
  catch(e){ storageOK = false; }
  return structuredClone(SEED);
}
function save(opts){
  const o = opts || {};
  if(!o.keepTs) S.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; renderPersistNote(); }
  if(!o.noPush) agendarPush();
}
S = load();

const potes = () => S.potes;
const byId  = id => S.potes.find(p => p.id === id);
const livre = () => S.potes.find(p => p.livre);
const total = () => S.potes.reduce((a,p) => a + p.saldo, 0);
const somaAportes = () => S.potes.filter(p => !p.livre).reduce((a,p) => a + p.aporte, 0);
/* o Livre nao entra na lista: ele mora no bloco de cima */
const guardados = () => S.potes.filter(p => !p.livre);
const tagsDe = p => Array.isArray(p.tags) ? p.tags : [];
const todasTags = () => [...new Set(guardados().flatMap(tagsDe))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
let filtro = "";

/* ---------- movimentos ---------- */
function commit(desc, movs){
  movs = movs.filter(m => m.delta !== 0);
  for(const m of movs){ const p = byId(m.poteId); if(p) p.saldo += m.delta; }
  S.hist.unshift({id:uid(), ts:Date.now(), desc, movs});
  save(); render();
}
/* so da pra desfazer se todo pote envolvido ainda existir — senao o dinheiro
   do lado que foi apagado nao teria pra onde voltar e sumiria do total */
const podeDesfazer = e => e.movs.length > 0 && e.movs.every(m => !!byId(m.poteId));

function undo(hid){
  const i = S.hist.findIndex(h => h.id === hid);
  if(i < 0 || !podeDesfazer(S.hist[i])) return;
  for(const m of S.hist[i].movs){ byId(m.poteId).saldo -= m.delta; }
  S.hist.splice(i,1); save(); render();
}

/* ---------- modal ---------- */
const dlg = document.getElementById("dlg");
function modal({title, body, okLabel="Salvar", okKind="", soloOk=false, onOk}){
  dlg.innerHTML =
    '<form method="dialog"><div class="d-head">'+esc(title)+'</div>'+
    '<div class="d-body">'+body+'</div>'+
    '<div class="d-foot">'+
    (soloOk ? '' : '<button value="cancel" class="ghost">Cancelar</button>')+
    '<button value="ok" class="primary '+okKind+'">'+esc(okLabel)+'</button></div></form>';
  dlg.querySelector("form").addEventListener("submit", ev => {
    if(ev.submitter && ev.submitter.value === "ok" && onOk && onOk(dlg) === false) ev.preventDefault();
  });
  dlg.showModal();
  const f = dlg.querySelector("input,select");
  if(f){ f.focus(); if(f.select) f.select(); }
  return dlg;
}
/* mostra o saldo resultante enquanto o usuario digita */
function vincularPreview(d, calc){
  const inp = d.querySelector("#v"), out = d.querySelector("#pv");
  if(!inp || !out) return;
  const upd = () => {
    const v = parseMoney(inp.value);
    out.innerHTML = (!Number.isFinite(v) || v <= 0) ? '' : calc(v);
  };
  inp.addEventListener("input", upd); upd();
}

/* ---------- acoes ---------- */
function abrirReceber(){
  const d = modal({title:"Entrada mensal", okLabel:"Distribuir", body:
    '<div><label>Quanto entrou</label><input id="v" inputmode="decimal" value="'+(S.renda/100).toFixed(2).replace(".",",")+'"></div>'+
    '<div><label>Referência</label><input id="d" placeholder="Salário de setembro"></div>'+
    '<div class="preview" id="pv"></div>',
    onOk:(d)=>{
      const v = parseMoney(d.querySelector("#v").value);
      if(!Number.isFinite(v) || v === 0) return false;
      const movs = potes().filter(p=>!p.livre).map(p=>({poteId:p.id, delta:p.aporte}));
      movs.push({poteId:livre().id, delta: v - somaAportes()});
      commit(d.querySelector("#d").value.trim() || "Entrada", movs);
    }});
  vincularPreview(d, v => {
    const resto = v - somaAportes();
    let h = potes().filter(p=>!p.livre).map(p=>'<div><span>'+esc(p.nome)+'</span><span>'+fmt(p.aporte)+'</span></div>').join("");
    h += '<div class="tot"><span>'+esc(livre().nome)+'</span><span>'+fmt(resto)+'</span></div>';
    if(resto < 0) h = h.replace('<div class="tot">','<div class="tot warn">');
    return h;
  });
}

/* guardar: sai do Livre e entra no pote */
function abrirGuardar(poteId){
  const p = byId(poteId), L = livre();
  const d = modal({title:"Guardar em "+p.nome, okLabel:"Guardar", body:
    '<div><label>Valor</label><input id="v" inputmode="decimal" placeholder="0,00"></div>'+
    '<div><label>Descrição (opcional)</label><input id="d" placeholder="Reforço do mês"></div>'+
    '<div class="hint" id="pv"></div>',
    onOk:(d)=>{
      const v = parseMoney(d.querySelector("#v").value);
      if(!Number.isFinite(v) || v <= 0) return false;
      const desc = d.querySelector("#d").value.trim() || (L.nome+" → "+p.nome);
      commit(desc, [{poteId:L.id, delta:-v},{poteId:p.id, delta:v}]);
    }});
  vincularPreview(d, v => {
    const rest = L.saldo - v;
    return esc(p.nome)+' <b>'+fmt(p.saldo+v)+'</b> · '+esc(L.nome)+
      ' <b class="'+(rest<0?"neg":"")+'">'+fmt(rest)+'</b>';
  });
}

/* resgatar: volta do pote pro Livre */
function abrirResgatar(poteId){
  const p = byId(poteId), L = livre();
  const d = modal({title:"Resgatar de "+p.nome, okLabel:"Resgatar", body:
    '<div><label>Valor</label><input id="v" inputmode="decimal" placeholder="0,00"></div>'+
    '<div><label>Descrição (opcional)</label><input id="d" placeholder="Precisei usar"></div>'+
    '<div class="hint" id="pv"></div>',
    onOk:(d)=>{
      const v = parseMoney(d.querySelector("#v").value);
      if(!Number.isFinite(v) || v <= 0) return false;
      const desc = d.querySelector("#d").value.trim() || (p.nome+" → "+L.nome);
      commit(desc, [{poteId:p.id, delta:-v},{poteId:L.id, delta:v}]);
    }});
  vincularPreview(d, v => {
    const rest = p.saldo - v;
    return esc(p.nome)+' <b class="'+(rest<0?"neg":"")+'">'+fmt(rest)+'</b> · '+
      esc(L.nome)+' <b>'+fmt(L.saldo+v)+'</b>';
  });
}

function abrirFluxo(poteId, sinal){

function abrirTransf(fromId){
  const opts = potes().map(p=>'<option value="'+p.id+'">'+esc(p.nome)+'</option>').join("");
  modal({title:"Transferir entre potes", okLabel:"Transferir", body:

      const v = parseMoney(d.querySelector("#v").value);

}

const lerTags = txt => [...new Set(String(txt||"").split(",")
  .map(t => t.trim().toLowerCase()).filter(Boolean))].slice(0, 6);

function abrirPote(poteId){
  const p = poteId ? byId(poteId) : null, isLivre = p && p.livre;
  const d = modal({title: p ? "Editar "+p.nome : "Novo pote", body:
    '<div><label>Nome</label><input id="n" value="'+(p?esc(p.nome):"")+'" placeholder="Viagem"></div>'+
    (isLivre ? '' :
    '<div><label>Aporte mensal</label><input id="a" inputmode="decimal" value="'+(p?(p.aporte/100).toFixed(2).replace(".",","):"")+'" placeholder="0,00"></div>'+
    '<div><label>Meta (deixe vazio pra não ter)</label><input id="m" inputmode="decimal" value="'+(p&&p.meta?(p.meta/100).toFixed(2).replace(".",","):"")+'"></div>'+
    '<div><label>Tags (vírgula)</label><input id="t" value="'+(p?esc(tagsDe(p).join(", ")):"")+'" placeholder="mercado, fixo"></div>')+
    (p ? '' : '<div><label>Saldo inicial</label><input id="s" inputmode="decimal" placeholder="0,00"></div>'),
    onOk:(d)=>{
      const nome = d.querySelector("#n").value.trim();
      if(!nome) return false;
      if(p){
        p.nome = nome;
        if(!isLivre){
          const a = parseMoney(d.querySelector("#a").value); p.aporte = Number.isFinite(a)&&a>0 ? a : 0;
          const m = parseMoney(d.querySelector("#m").value); p.meta   = Number.isFinite(m)&&m>0 ? m : 0;
          p.tags = lerTags(d.querySelector("#t").value);
        }
        save(); render();
      }else{
        const a = parseMoney(d.querySelector("#a").value);
        const m = parseMoney(d.querySelector("#m").value);
        const s = parseMoney(d.querySelector("#s").value);
        const np = {id:uid(), nome, aporte:Number.isFinite(a)&&a>0?a:0, saldo:0,
                    meta:Number.isFinite(m)&&m>0?m:0, tags:lerTags(d.querySelector("#t").value), livre:false};
        S.potes.push(np);
        S.potes.sort((x,y)=> (x.livre?1:0)-(y.livre?1:0));
        if(Number.isFinite(s) && s>0) commit("Criou "+nome, [{poteId:livre().id,delta:-s},{poteId:np.id,delta:s}]);
        else { save(); render(); }
      }
    }});
  /* Excluir mora aqui dentro pra nao poluir o card */
  if(p && !isLivre){
    const b = document.createElement("button");
    b.className = "ghost danger"; b.textContent = "Excluir";
    b.style.marginRight = "auto";
    b.onclick = ev => { ev.preventDefault(); dlg.close(); excluirPote(poteId); };
    d.querySelector(".d-foot").prepend(b);
  }
}

/* menu do pote: a linha e compacta, as acoes moram aqui */
function abrirAcoes(poteId){
  const p = byId(poteId);
  if(!p || p.livre) return;
  const pct   = p.meta > 0 ? Math.max(0, Math.min(100, p.saldo/p.meta*100)) : null;
  const meses = (p.meta > 0 && p.aporte > 0 && p.saldo < p.meta) ? Math.ceil((p.meta-p.saldo)/p.aporte) : null;
  const cheio = p.meta > 0 && p.saldo >= p.meta;
  const d = modal({title:p.nome, okLabel:"Fechar", soloOk:true, body:
    '<div class="lb-val'+(p.saldo<0?" neg":"")+'">'+fmt(p.saldo)+'</div>'+
    '<div class="pote-sub"><span>'+(p.aporte?fmt(p.aporte)+"/mês":"")+'</span>'+
      (p.meta?'<span>'+fmt(p.meta)+'</span>':'')+'</div>'+
    (pct!==null?'<div class="meter"><i style="width:'+pct.toFixed(1)+'%"></i></div>':'')+
    (meses!==null?'<div class="hint">'+meses+' '+(meses===1?"mês":"meses")+'</div>':'')+
    (cheio?'<div class="hint" style="color:var(--accent)">meta batida</div>':'')+
    '<div class="acts-grid">'+
      '<button data-go="guardar">+ Guardar</button>'+
      '<button data-go="gastei">− Gasto</button>'+
      '<button data-go="resgatar">Resgatar</button>'+
      '<button class="smash" data-go="quebrar"'+(p.saldo<=0?" disabled":"")+'>Quebrar</button>'+
      '<button class="ghost full" data-go="edit">Editar</button>'+
    '</div>'});
  d.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => {
    ev.preventDefault(); dlg.close();
    const go = b.dataset.go;
    if(go==="guardar")  abrirGuardar(poteId);
    if(go==="gastei")   abrirFluxo(poteId, -1);
    if(go==="resgatar") abrirResgatar(poteId);
    if(go==="quebrar")  abrirQuebrar(poteId);
    if(go==="edit")     abrirPote(poteId);
  });
}

/* ================= sincronia via gist =================
   O token nunca entra neste arquivo: voce digita ao conectar e ele fica
   guardado so no seu navegador. O conteudo sobe cifrado, entao a URL do
   gist vazar nao expoe saldo nenhum. */
const CKEY = "potes.conn";
let conn = null;          // {token, gistId, pass}
let lastSync = 0;         // updatedAt remoto da ultima vez que batemos
let pushTimer = null, syncing = false, syncErr = "";

try{
  conn = JSON.parse(localStorage.getItem(CKEY) || "null");
  lastSync = Number(localStorage.getItem("potes.lastSync") || 0);
}catch(e){ conn = null; }

const salvarConn = () => { try{
  conn ? localStorage.setItem(CKEY, JSON.stringify(conn)) : localStorage.removeItem(CKEY);
  localStorage.setItem("potes.lastSync", String(lastSync));
}catch(e){} };

/* ---- AES-GCM com chave derivada da senha ---- */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64  = u8 => btoa(String.fromCharCode(...u8));
const ub64 = st => Uint8Array.from(atob(st), c => c.charCodeAt(0));

async function derivar(pass, salt){
  const km = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:210000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function cifrar(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await derivar(pass, salt);
  const ct   = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj)));
  return JSON.stringify({v:1, alg:"AES-GCM", kdf:"PBKDF2-SHA256-210k",
    salt:b64(salt), iv:b64(iv), data:b64(new Uint8Array(ct))}, null, 1);
}
async function decifrar(txt, pass){
  const o = JSON.parse(txt);
  if(!o || o.v !== 1) throw new Error("formato");
  const key = await derivar(pass, ub64(o.salt));
  const pt  = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub64(o.iv)}, key, ub64(o.data));
  return JSON.parse(dec.decode(pt));
}

/* ---- API do gist ---- */
const ARQ = "potes.json";
async function gh(path, opts){
  const r = await fetch("https://api.github.com"+path, Object.assign({
    headers:{ "Authorization":"Bearer "+conn.token, "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28", "Content-Type":"application/json" }
  }, opts||{}));
  if(!r.ok) throw new Error("GitHub "+r.status);
  return r.json();
}
async function criarGist(){
  const body = {description:"potes", public:false, files:{[ARQ]:{content: await cifrar(S, conn.pass)}}};
  const g = await gh("/gists", {method:"POST", body:JSON.stringify(body)});
  return g.id;
}
async function baixar(){
  const g = await gh("/gists/"+conn.gistId);
  const f = g.files && g.files[ARQ];
  if(!f) throw new Error("arquivo ausente");
  const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  return decifrar(txt, conn.pass);
}
async function subir(){
  await gh("/gists/"+conn.gistId, {method:"PATCH",
    body: JSON.stringify({files:{[ARQ]:{content: await cifrar(S, conn.pass)}}})});
  lastSync = S.updatedAt; salvarConn();
}

function marcar(estado, msg){
  syncErr = msg || "";
  const b = document.getElementById("bCloud");
  b.classList.remove("on","err","busy");
  if(estado) b.classList.add(estado);
  renderPersistNote();
}
function agendarPush(){
  if(!conn) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { sincronizar(); }, 1200);
}

/* Conflito = os dois lados mudaram desde a ultima vez que bateram. */
async function sincronizar(silencioso){
  if(!conn || syncing) return;
  syncing = true; marcar("busy");
  try{
    const remoto = await baixar();
    const rTs = remoto.updatedAt || 0, lTs = S.updatedAt || 0;
    if(rTs !== lastSync && lTs > lastSync){
      syncing = false; marcar("on");
      return conflito(remoto, rTs);
    }
    if(rTs > lTs){ adotar(remoto, rTs); }
    else if(lTs > rTs){ await subir(); }
    else { lastSync = rTs; salvarConn(); }
    marcar("on");
  }catch(e){
    marcar("err", String(e.message || e));
    if(!silencioso) console.warn(e);
  }finally{ syncing = false; }
}
function adotar(remoto, rTs){
  S = remoto; lastSync = rTs; salvarConn();
  save({keepTs:true, noPush:true}); render();
}
function conflito(remoto, rTs){
  const d = modal({title:"Versões diferentes", okLabel:"Usar a da nuvem", body:
    '<div class="hint">Nuvem: '+quando(rTs)+' · Aqui: '+quando(S.updatedAt)+'</div>'+
    '<div class="hint">Nuvem '+fmt(remoto.potes.reduce((a,p)=>a+p.saldo,0))+
      ' · Aqui '+fmt(total())+'</div>',
    onOk:()=>{ adotar(remoto, rTs); marcar("on"); }});
  const b = document.createElement("button");
  b.className = "ghost"; b.textContent = "Manter este";
  b.onclick = ev => { ev.preventDefault(); dlg.close();
    lastSync = rTs; subir().then(()=>marcar("on")).catch(e=>marcar("err",String(e.message||e))); };
  d.querySelector(".d-foot").prepend(b);
}

function abrirConexao(){
  const c = conn || {token:"", gistId:"", pass:""};
  modal({title: conn ? "Sincronia" : "Conectar", okLabel: conn ? "Sincronizar" : "Conectar", body:
    '<div><label>Token</label><input id="tk" type="password" value="'+esc(c.token)+'" autocomplete="off"></div>'+
    '<div><label>Senha</label><input id="pw" type="password" value="'+esc(c.pass)+'" autocomplete="off"></div>'+
    '<div><label>Gist</label><input id="gi" class="mono" value="'+esc(c.gistId)+'" placeholder="vazio cria um novo"></div>'+
    (syncErr ? '<div class="hint" style="color:var(--danger)">'+esc(syncErr)+'</div>' : ''),
    onOk:(d)=>{
      const token = d.querySelector("#tk").value.trim();
      const pass  = d.querySelector("#pw").value;
      const gid   = d.querySelector("#gi").value.trim();
      if(!token || !pass) return false;
      conn = {token, pass, gistId:gid};
      (async () => {
        marcar("busy");
        try{
          if(!conn.gistId){ conn.gistId = await criarGist(); lastSync = S.updatedAt; }
          salvarConn(); renderConn();
          await sincronizar();
        }catch(e){ marcar("err", String(e.message || e)); renderConn(); }
      })();
    }});
}
function desconectar(){
  modal({title:"Desconectar?", okLabel:"Desconectar", okKind:"danger", body:
    '<div class="hint">'+esc((conn&&conn.gistId)||"")+'</div>',
    onOk:()=>{ conn = null; lastSync = 0;
      try{ localStorage.removeItem(CKEY); localStorage.removeItem("potes.lastSync"); }catch(e){}
      marcar(""); renderConn(); }});
}
function renderConn(){
  document.getElementById("bOut").hidden = !conn;
  if(conn && !syncErr) marcar("on");
}

/* ---------- backup ---------- */
function exportar(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "potes-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importar(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const o = JSON.parse(r.result);
        if(!o || !Array.isArray(o.potes) || !o.potes.some(p=>p.livre)) throw 0;
        S = o; save(); render();
      }catch(e){ alert("Arquivo inválido."); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- render ---------- */
function quando(ts){
  const d = new Date(ts);
  return (Date.now()-ts)/36e5 < 24
    ? d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})
    : d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
}
function renderPersistNote(){
  const n = document.getElementById("persistNote");
  const msg = !storageOK ? "Este navegador não está guardando os dados." : (syncErr ? "Sincronia: "+syncErr : "");
  n.textContent = msg;
  n.style.color = msg ? "var(--danger)" : "";
}
function render(){
  const L = livre();
  document.getElementById("rendaLbl").textContent = fmt(S.renda);
  document.getElementById("sub").textContent =
    fmt(somaAportes()) + " guardados · " + fmt(S.renda - somaAportes()) + " livres por mês";

  document.getElementById("livreNome").textContent = L.nome;
  const lv = document.getElementById("livreVal");
  lv.textContent = fmt(L.saldo);
  lv.classList.toggle("neg", L.saldo < 0);
  document.getElementById("livreSub").textContent =
    "de " + fmt(total()) + " · " + fmt(total() - L.saldo) + " nos potes";

  renderChips();

  const lista = guardados().filter(p => !filtro || tagsDe(p).includes(filtro));
  document.getElementById("potes").innerHTML = lista.length === 0
    ? '<div class="empty">'+(filtro ? "Nenhum pote com essa tag." : "Nenhum pote ainda.")+'</div>'
    : lista.map(p => {
    const pct = p.meta > 0 ? Math.max(0, Math.min(100, p.saldo/p.meta*100)) : null;
    return '<div class="row" data-row="'+p.id+'">'+
      (filtro ? '' : '<span class="grip" aria-hidden="true">⠿</span>')+
      '<span class="dot"></span>'+
      '<span class="rname">'+esc(p.nome)+'</span>'+
      '<span class="rtags">'+tagsDe(p).map(t=>'<span class="rtag">'+esc(t)+'</span>').join("")+'</span>'+
      '<span class="rval'+(p.saldo<0?" neg":"")+'">'+fmt(p.saldo)+'</span>'+
      '<span class="chev">›</span>'+
      (pct!==null?'<i class="rbar" style="width:'+pct.toFixed(1)+'%"></i>':'')+
    '</div>';
  }).join("");

  const h = document.getElementById("hist");
  h.innerHTML = S.hist.length === 0 ? '<div class="empty">Nada por aqui ainda.</div>' :
    S.hist.slice(0,40).map(e => {
      const soma = e.movs.reduce((a,m)=>a+m.delta,0);
      const interno = e.movs.length===2 && soma===0;
      const val = interno ? Math.abs(e.movs[0].delta) : soma;
      const cls = interno ? "" : (soma>0?"pos":soma<0?"neg":"");
      return '<div class="h-row"><div class="h-main"><div class="h-desc">'+esc(e.desc)+'</div>'+
        '<div class="h-when">'+quando(e.ts)+'</div></div>'+
        (e.movs.length?'<div class="h-val '+cls+'">'+(soma>0&&!interno?"+":"")+fmt(val)+'</div>':'')+
        (e.movs.length?'<button class="mini ghost" data-act="undo" data-id="'+e.id+'"'+(podeDesfazer(e)?'':' disabled')+'>desfazer</button>':'')+
      '</div>';
    }).join("");

  renderPersistNote();
}

/* clique na linha abre o menu do pote; no chip, filtra */

});

/* arrastar pela alcinha — pointer events pra funcionar no toque tambem */
(function(){
  const lista = document.getElementById("potes");
  let el = null;
  const mover = ev => {
    const alvo = document.elementFromPoint(ev.clientX, ev.clientY);
    const row = alvo && alvo.closest(".row");
    if(!row || row === el || row.parentNode !== el.parentNode) return;
    const r = row.getBoundingClientRect();
    row.parentNode.insertBefore(el, ev.clientY > r.top + r.height/2 ? row.nextSibling : row);
  };
  const soltar = () => {
    document.removeEventListener("pointermove", mover);
    if(!el) return;
    el.classList.remove("dragging");
    const ordem = [...lista.querySelectorAll(".row")].map(r => r.dataset.row);
    S.potes.sort((a,b) => {
      if(a.livre !== b.livre) return a.livre ? 1 : -1;
      return ordem.indexOf(a.id) - ordem.indexOf(b.id);
    });
    el = null; save(); render();
  };
  lista.addEventListener("pointerdown", ev => {
    if(!ev.target.closest(".grip")) return;
    ev.preventDefault();
    el = ev.target.closest(".row");
    el.classList.add("dragging");
    document.addEventListener("pointermove", mover);
    document.addEventListener("pointerup", soltar, {once:true});
    document.addEventListener("pointercancel", soltar, {once:true});
  });
})();

document.addEventListener("click", ev => {
  const b = ev.target.closest("button[data-act]");
  if(!b) return;
  const {act, id} = b.dataset;
  if(act==="guardar")  abrirGuardar(id);
  if(act==="resgatar") abrirResgatar(id);
  if(act==="quebrar")  abrirQuebrar(id);
  if(act==="gastei")   abrirFluxo(id, -1);
  if(act==="entrou")   abrirFluxo(id, +1);
  if(act==="edit")     abrirPote(id);
  if(act==="del")      excluirPote(id);
  if(act==="undo")     undo(id);
});
